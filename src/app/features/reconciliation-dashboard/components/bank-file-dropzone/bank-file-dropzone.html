<section
  class="import-dropzone-row"
  (dragover)="onDragOver($event)"
  (dragleave)="onDragLeave($event)"
  (drop)="onDrop($event)"
>
  <input
    #bankInput
    type="file"
    accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
    hidden
    (change)="onInputChange($event)"
  />
  <button type="button" class="import-dropzone" [class.import-dropzone--over]="dragOver()" (click)="bankInput.click()">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 16V4M7 9l5-5 5 5" />
      <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3" />
    </svg>
    <span class="import-dropzone__label">
      <span>Arrastra tu archivo aquí</span>
      <span class="import-dropzone__hint">o selecciona un archivo</span>
    </span>
  </button>
</section>

@if (file(); as loaded) {
  <div class="file-loaded">
    <svg class="file-loaded__check" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <circle cx="12" cy="12" r="9" />
      <path stroke-linecap="round" stroke-linejoin="round" d="m8 12 3 3 5-6" />
    </svg>
    <div class="file-loaded__text">
      <span class="file-loaded__name" [attr.title]="loaded.name">{{ loaded.name }}</span>
      <span class="file-loaded__meta">
        <span class="text-success">Archivo cargado correctamente</span> · {{ formatFileSize(loaded.size) }}
      </span>
    </div>
  </div>
}
