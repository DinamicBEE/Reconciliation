<div class="validation" role="status" aria-live="polite">
  <svg class="gears" viewBox="0 0 90 80" width="108" height="96" aria-hidden="true">
    <g class="gear gear--a">
      <circle cx="30" cy="44" r="16" fill="currentColor" />
      <g fill="currentColor" transform="translate(30 44)">
        <rect x="-3.5" y="-22" width="7" height="8" rx="1.5" />
        <rect x="-3.5" y="-22" width="7" height="8" rx="1.5" transform="rotate(45)" />
        <rect x="-3.5" y="-22" width="7" height="8" rx="1.5" transform="rotate(90)" />
        <rect x="-3.5" y="-22" width="7" height="8" rx="1.5" transform="rotate(135)" />
        <rect x="-3.5" y="-22" width="7" height="8" rx="1.5" transform="rotate(180)" />
        <rect x="-3.5" y="-22" width="7" height="8" rx="1.5" transform="rotate(225)" />
        <rect x="-3.5" y="-22" width="7" height="8" rx="1.5" transform="rotate(270)" />
        <rect x="-3.5" y="-22" width="7" height="8" rx="1.5" transform="rotate(315)" />
      </g>
      <circle cx="30" cy="44" r="6" class="gear__hole" />
    </g>
    <g class="gear gear--b">
      <circle cx="57" cy="29" r="10" fill="currentColor" />
      <g fill="currentColor" transform="translate(57 29)">
        <rect x="-2.75" y="-15" width="5.5" height="6" rx="1.2" />
        <rect x="-2.75" y="-15" width="5.5" height="6" rx="1.2" transform="rotate(60)" />
        <rect x="-2.75" y="-15" width="5.5" height="6" rx="1.2" transform="rotate(120)" />
        <rect x="-2.75" y="-15" width="5.5" height="6" rx="1.2" transform="rotate(180)" />
        <rect x="-2.75" y="-15" width="5.5" height="6" rx="1.2" transform="rotate(240)" />
        <rect x="-2.75" y="-15" width="5.5" height="6" rx="1.2" transform="rotate(300)" />
      </g>
      <circle cx="57" cy="29" r="4" class="gear__hole" />
    </g>
  </svg>

  <strong class="validation__title">{{ title() }}</strong>
  @for (line of subtitles(); track line) {
    <span class="validation__subtitle">{{ line }}</span>
  }

  <nz-progress class="validation__progress" [nzPercent]="percent()" nzStatus="active" />
</div>
