<section class="import-dropzone-row">
  <input #csvInput type="file" accept=".csv,text/csv" hidden (change)="onSelected($event)" />
  <button type="button" class="import-dropzone" (click)="csvInput.click()">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 16V4M7 9l5-5 5 5" />
      <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3" />
    </svg>
    <span>Importar CSV</span>
  </button>
</section>
