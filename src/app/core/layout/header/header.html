<header class="app-header">
  <span class="app-header__title">Conciliación Bancaria</span>

  <div class="app-header__actions">
    <div class="app-header__search">
      @if (!searchOpen()) {
        <button type="button" class="icon-button" (click)="openSearch()" aria-label="Buscar pantallas">
          <!-- lupa -->
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="7" />
            <path stroke-linecap="round" d="M21 21l-4.35-4.35" />
          </svg>
        </button>
      } @else {
        <div class="search-box">
          <svg
            class="search-box__icon"
            viewBox="0 0 24 24"
            width="16"
            height="16"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <circle cx="11" cy="11" r="7" />
            <path stroke-linecap="round" d="M21 21l-4.35-4.35" />
          </svg>
          <input
            #searchInput
            type="text"
            class="search-box__input"
            role="combobox"
            aria-label="Buscar pantallas"
            aria-autocomplete="list"
            [attr.aria-expanded]="results().length > 0 ? 'true' : 'false'"
            placeholder="Buscar pantallas…"
            [value]="query()"
            (input)="onSearchInput($any($event.target).value)"
            (keydown)="onSearchKeydown($event)"
            (blur)="closeSearch()"
          />

          @if (results().length > 0) {
            <ul class="search-box__results" role="listbox">
              @for (page of results(); track page.path) {
                <li role="option">
                  <button
                    type="button"
                    class="search-box__result"
                    (mousedown)="$event.preventDefault()"
                    (click)="goTo(page)"
                  >
                    {{ page.label }}
                  </button>
                </li>
              }
            </ul>
          }
        </div>
      }
    </div>

    <button
      type="button"
      class="icon-button"
      nz-popover
      [nzPopoverContent]="notificationsContent"
      nzPopoverTrigger="click"
      nzPopoverPlacement="bottomRight"
      aria-label="Notificaciones"
    >
      <!-- notificaciones -->
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"
        />
        <path stroke-linecap="round" stroke-linejoin="round" d="M13.73 21a2 2 0 0 1-3.46 0" />
      </svg>
    </button>

    <button type="button" class="icon-button" (click)="onLogout()" aria-label="Cerrar sesión">
      <!-- salir -->
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" />
        <path stroke-linecap="round" stroke-linejoin="round" d="M10 17l5-5-5-5" />
        <path stroke-linecap="round" d="M15 12H3" />
      </svg>
    </button>

    @if (auth.currentUser(); as user) {
      <div class="user-card" [attr.title]="user.fullName + ' — ' + user.role">
        <nz-avatar class="user-card__avatar" [nzText]="initials()" [ngStyle]="avatarStyle()" />
        <div class="user-card__info">
          <span class="user-card__name">{{ shortName() }}</span>
          <span class="user-card__role">{{ user.role }}</span>
        </div>
      </div>
    }
  </div>
</header>

<ng-template #notificationsContent>
  <div class="notifications-empty">No tienes notificaciones nuevas.</div>
</ng-template>
