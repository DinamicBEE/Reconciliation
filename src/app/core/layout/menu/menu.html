<nav class="app-menu" [class.app-menu--expanded]="menu.expanded()">
  <button
    type="button"
    class="app-menu__toggle"
    (click)="menu.toggle()"
    [attr.aria-label]="menu.expanded() ? 'Contraer menú' : 'Expandir menú'"
  >
    @if (menu.expanded()) {
      <!-- flecha izquierda: contraer -->
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 18l-6-6 6-6" />
      </svg>
    } @else {
      <!-- flecha derecha: expandir -->
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 18l6-6-6-6" />
      </svg>
    }
  </button>

  <div class="app-menu__items">
    <a
      class="app-menu__link"
      routerLink="/dashboard"
      routerLinkActive="app-menu__link--active"
      [attr.title]="!menu.expanded() ? 'Dashboard' : null"
    >
      <span class="app-menu__icon">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="9" rx="1" />
          <rect x="14" y="3" width="7" height="5" rx="1" />
          <rect x="14" y="12" width="7" height="9" rx="1" />
          <rect x="3" y="16" width="7" height="5" rx="1" />
        </svg>
      </span>
      <span class="app-menu__label">Dashboard</span>
    </a>

    <a
      class="app-menu__link"
      routerLink="/conciliacion"
      routerLinkActive="app-menu__link--active"
      [attr.title]="!menu.expanded() ? 'Conciliación' : null"
    >
      <span class="app-menu__icon">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M17 2l4 4-4 4M3 11V9a4 4 0 0 1 4-4h14M7 22l-4-4 4-4M21 13v2a4 4 0 0 1-4 4H3"
          />
        </svg>
      </span>
      <span class="app-menu__label">Conciliación</span>
    </a>

    <a
      class="app-menu__link"
      routerLink="/usuarios"
      routerLinkActive="app-menu__link--active"
      [attr.title]="!menu.expanded() ? 'Usuarios' : null"
    >
      <span class="app-menu__icon">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
          <circle cx="9" cy="7" r="4" />
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"
          />
        </svg>
      </span>
      <span class="app-menu__label">Usuarios</span>
    </a>
  </div>

  <div class="app-menu__separator"></div>

  <div class="app-menu__footer">
    <button
      type="button"
      class="app-menu__link"
      nz-popover
      [nzPopoverContent]="paletteContent"
      nzPopoverTrigger="click"
      nzPopoverPlacement="rightBottom"
      aria-label="Cambiar paleta de colores"
      [attr.title]="!menu.expanded() ? 'Paleta de colores' : null"
    >
      <span class="app-menu__icon">
        <!-- paleta de colores -->
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="9" />
          <circle cx="12" cy="7.5" r="1.3" fill="currentColor" stroke="none" />
          <circle cx="16.5" cy="12" r="1.3" fill="currentColor" stroke="none" />
          <circle cx="12" cy="16.5" r="1.3" fill="currentColor" stroke="none" />
          <circle cx="7.5" cy="12" r="1.3" fill="currentColor" stroke="none" />
        </svg>
      </span>
      <span class="app-menu__label">Paleta de colores</span>
    </button>

    <button
      type="button"
      class="app-menu__link"
      (click)="theme.toggle()"
      [attr.aria-label]="theme.mode() === 'dark' ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'"
      [attr.title]="!menu.expanded() ? (theme.mode() === 'dark' ? 'Modo claro' : 'Modo oscuro') : null"
    >
      <span class="app-menu__icon">
        @if (theme.mode() === 'dark') {
          <!-- sol -->
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="4" />
            <path
              stroke-linecap="round"
              d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"
            />
          </svg>
        } @else {
          <!-- luna -->
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"
            />
          </svg>
        }
      </span>
      <span class="app-menu__label">{{ theme.mode() === 'dark' ? 'Modo claro' : 'Modo oscuro' }}</span>
    </button>

    <button
      type="button"
      class="app-menu__link"
      (click)="onLogout()"
      aria-label="Cerrar sesión"
      [attr.title]="!menu.expanded() ? 'Cerrar sesión' : null"
    >
      <span class="app-menu__icon">
        <!-- salir -->
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M10 17l5-5-5-5" />
          <path stroke-linecap="round" d="M15 12H3" />
        </svg>
      </span>
      <span class="app-menu__label">Cerrar sesión</span>
    </button>
  </div>
</nav>

<ng-template #paletteContent>
  <div class="palette-picker">
    @for (opt of palette.options; track opt.hex) {
      <button
        type="button"
        class="palette-swatch"
        [class.palette-swatch--selected]="palette.selected() === opt.hex"
        [style.background]="opt.hex"
        [attr.aria-label]="'Usar acento ' + opt.name"
        [attr.title]="opt.name"
        (click)="onSwatchClick(opt.hex)"
      ></button>
    }
  </div>
</ng-template>
